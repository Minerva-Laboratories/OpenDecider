# Clean-provenance 2B: same architecture as runs/x2b, trained from scratch on data/clean_train (no share-alike,
# non-commercial or LLM-labelled sources), on the DEPLOYED int8 backbone features (backbone_weight_quant: null), with
# the explicit "none of the above" option supervised (gold removed / unknowable -> none) and conformal scores stored.
backbone: configs/backbone_2b.yaml
model:
  variant: v3
  d_model: 512
  n_heads: 8
  decision_layers: 4
  slot_emb: none
  dropout: 0.1
  v3_features: branched
  v3_cross: question
  v3_row_format: answer
  v3_lm_feature: true
  v3_vera_layers: 24
  v3_vera_scope: all
  v3_vera_rank: 256
  v3_layer_combine: attn
  v3_row_checkpoint: true
train:
  data: [data/synthetic/train.jsonl, data/clean_train/kept_public_train.jsonl, data/clean_train/topics_train.jsonl,
         data/clean_train/reading_train.jsonl, data/clean_train/knowledge_train.jsonl,
         data/clean_train/kept_knowledge_train.jsonl, data/clean_train/kept_injection_train.jsonl,
         data/clean_train/injection_train.jsonl, data/clean_train/harmful_train.jsonl,
         data/clean_train/ordinal_train.jsonl, data/clean_train/kept_context_train.jsonl,
         data/synthetic/uncertainty_train.jsonl]
  data_weights: [0.15, 0.15, 0.08, 0.10, 0.06, 0.06, 0.02, 0.13, 0.02, 0.05, 0.12, 0.06]   # kept_injection = Gandalf only
  val: [data/synthetic/val.jsonl, data/clean_train/kept_public_val.jsonl, data/clean_train/topics_val.jsonl,
        data/clean_train/reading_val.jsonl, data/clean_train/knowledge_val.jsonl, data/clean_train/kept_injection_val.jsonl,
        data/clean_train/injection_val.jsonl, data/clean_train/ordinal_val.jsonl]
  calib: [data/synthetic/calib.jsonl, data/clean_train/kept_public_calib.jsonl, data/clean_train/topics_calib.jsonl,
          data/clean_train/reading_calib.jsonl, data/clean_train/knowledge_calib.jsonl,
          data/clean_train/kept_knowledge_calib.jsonl, data/clean_train/kept_injection_calib.jsonl,
          data/clean_train/injection_calib.jsonl, data/clean_train/harmful_calib.jsonl, data/clean_train/ordinal_calib.jsonl]
  seed: 0
  max_steps: 2500
  lr: 3.0e-4
  warmup: 100
  states_per_step: 2
  max_questions_per_state: 6
  max_state_tokens: 768
  option_wrap_p: 0.3
  consistency_weight: 0.5
  max_train_options: 32
  tokens_per_microbatch: 2000
  backbone_weight_quant: null     # train on the deployed (int8) backbone, not bf16
  none_p: 0.3
  none_drop_p: 0.25
  eval_every: 500
  eval_states: 800
  save_every: 500
