backbone: configs/backbone.yaml
model:
  variant: v1
  d_model: 512
  n_heads: 8
  decision_layers: 4
  n_codes: 8
  slot_emb: learned
  pointer: ptr
  resampler: 0            # 0 = off; 256 = Perceiver resampler to 256 latents
  dropout: 0.1
train:
  data: data/synthetic/train.jsonl
  val: data/synthetic/val.jsonl
  calib: data/synthetic/calib.jsonl
  seed: 0
  max_steps: 3000
  lr: 3.0e-4
  warmup: 100
  states_per_step: 8
  max_questions_per_state: 6
  max_state_tokens: 768
  brier_weight: 1.0
  ordinal_weight: 0.25
  relevance_weight: 0.1
  eval_every: 250
  save_every: 1000
  tokens_per_microbatch: 50000   # V1: no backbone gradients -> large micro-batches are cheap
