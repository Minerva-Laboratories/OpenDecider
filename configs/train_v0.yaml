backbone: configs/backbone.yaml
model:
  variant: v0
  d_model: 512
  slot_emb: none          # V0 already sees option order through the causal sequence
  pointer: ptr
  dropout: 0.1
  v0_prefix_cache: true
train:
  data: data/synthetic/train.jsonl
  val: data/synthetic/val.jsonl
  calib: data/synthetic/calib.jsonl
  seed: 0
  max_steps: 3000
  lr: 3.0e-4
  warmup: 100
  states_per_step: 8
  max_questions_per_state: 6
  max_state_tokens: 768
  brier_weight: 1.0
  ordinal_weight: 0.25
  relevance_weight: 0.1
  eval_every: 250
  save_every: 1000
