model:
  variant: v3
  d_model: 512
  n_heads: 8
  decision_layers: 4          # V3 stack depth
  slot_emb: none              # membership comes from the same-option attention bias; slots only for the O6 test
  dropout: 0.1
  v3_context_update: false    # true = context tokens also attend to options (per question)
  v3_readout: last            # last | mix (learned mix of all stack layers)
  text_cache: 200000
