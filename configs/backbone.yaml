path: models/qwen3.5-0.8b     # local copy; falls back to repo_id@revision when missing
repo_id: Qwen/Qwen3.5-0.8B
revision: 2fc06364715b967f1860aea9cf38778875588b17
dtype: bfloat16
weight_quant: int8            # none | int8 (weight-only, per-channel; lossless-ish) | nf4 (bnb; lossy on 0.8B)
