[project]
name = "opendecider"
version = "0.1.0"
description = "Open, speculative reconstruction of a System-One decision model (hypothesis test; not TypeSafe's code)."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["torch>=2.10", "transformers>=5.2", "pyyaml", "numpy", "fastapi", "uvicorn", "pydantic>=2"]

[project.optional-dependencies]
eval = ["lightgbm>=4", "matplotlib"]
quant = ["gemlite>=0.6", "bitsandbytes>=0.45"]      # w8 / w4 / awq / nf4 backbone variants (CUDA)
gguf = ["gguf>=0.19"]                               # 9B backbone from the Q4_0 GGUF

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["gpu: needs the real backbone on CUDA (takes the GPU lock)"]
filterwarnings = ["ignore::UserWarning"]
